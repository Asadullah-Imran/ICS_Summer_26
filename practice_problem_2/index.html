<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Problem Set 2 - Midterm</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-color-light: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-primary: #6d28d9;
            --accent-secondary: #0891b2;
            --border-color: #cbd5e1;
            --success: #10b981;
            --warning: #f59e0b;
            --header-bg: rgba(255, 255, 255, 0.8);
            --desc-bg: rgba(0,0,0,0.03);
            --code-text: #1e293b;
            --sol-bg: #f1f5f9;
            --sol-text: #334155;
        }

        [data-theme="dark"] {
            --bg-color: #0f111a;
            --surface-color: #1a1d2d;
            --surface-color-light: #252a3f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #8b5cf6;
            --accent-secondary: #06b6d4;
            --border-color: #2e344e;
            --success: #10b981;
            --warning: #f59e0b;
            --header-bg: rgba(26, 29, 45, 0.8);
            --desc-bg: rgba(0,0,0,0.2);
            --code-text: #e2e8f0;
            --sol-bg: #0d0f17;
            --sol-text: #a5b4fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        header {
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        .sidebar {
            position: sticky;
            top: 100px;
            height: calc(100vh - 120px);
            overflow-y: auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .sidebar h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .problem-link {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .problem-link:hover {
            background: var(--surface-color-light);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .problem-link.active {
            background: var(--surface-color-light);
            color: var(--accent-primary);
            font-weight: 700;
            border-left: 4px solid var(--accent-primary);
            transform: translateX(4px);
        }

        .problem-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            scroll-margin-top: 120px;
        }

        .problem-card:hover {
            transform: translateY(-2px);
        }

        .problem-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .problem-desc {
            color: var(--text-muted);
            white-space: pre-wrap;
            margin-bottom: 2rem;
            background: var(--desc-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 4px solid var(--accent-primary);
        }

        .io-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .io-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
        }

        .io-box h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--accent-secondary);
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }

        pre {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--code-text);
            white-space: pre-wrap;
        }

        .solution-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .solution-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .solution-btn:disabled {
            background: var(--surface-color-light);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .solution-content {
            display: none;
            margin-top: 1.5rem;
            background: var(--sol-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .solution-content.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .solution-content pre {
            color: var(--sol-text);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .countdown-alert {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 500;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: relative;
                top: 0;
                height: auto;
            }
            .io-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Practice Problem Set 2</h1>
        <button id="theme-toggle" style="background: var(--surface-color-light); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Inter', sans-serif;">🌓 Toggle Theme</button>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>Problems</h3>
            <div id="nav-links">
                <!-- Links injected via JS -->
            </div>
        </aside>

        <main>
            <div class="countdown-alert" id="countdown-alert">
                <span>🕒</span>
                <span id="countdown-text">Solutions will be revealed on August 18, 2026, 10:00 PM BDT.</span>
            </div>

            <div id="problems-container">
                <!-- Problems injected via JS -->
            </div>
        </main>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        const releaseDate = new Date('2026-08-18T22:00:00+06:00');
        
        const problems = [{"id": 1, "title": "University Cafeteria Billing System", "description": "A university cafeteria wants to develop a simple billing program for students. A student can purchase rice meals, drinks, and desserts.\n\nThe price of each item is:\nRice Meal = \u09f380\nDrink = \u09f330\nDessert = \u09f350\n\nThe cashier enters the quantity of each item purchased by the student. The program should calculate the total bill.\nIf the total bill is \u09f3500 or more, the cafeteria provides a 10% discount. Otherwise, no discount is given.\nThe program should display the original bill, discount amount, and final bill.", "ios": [{"in": "Rice: 4\nDrink: 4\nDessert: 2", "out": "Original Bill: 540\nDiscount: 54\nFinal Bill: 486"}, {"in": "Rice: 2\nDrink: 2\nDessert: 1", "out": "Original Bill: 270\nDiscount: 0\nFinal Bill: 270"}], "solution": "#include <stdio.h>\n\nint main() {\n    int rice, drink, dessert;\n    int total;\n    float discount = 0, final_bill;\n\n    scanf(\"%d %d %d\", &rice, &drink, &dessert);\n    total = (rice * 80) + (drink * 30) + (dessert * 50);\n\n    if (total >= 500) {\n        discount = total * 0.10;\n    }\n\n    final_bill = total - discount;\n\n    printf(\"Original Bill: %d\\n\", total);\n    printf(\"Discount: %.0f\\n\", discount);\n    printf(\"Final Bill: %.0f\\n\", final_bill);\n\n    return 0;\n}"}, {"id": 2, "title": "University Electricity Bill", "description": "A university department wants to calculate its monthly electricity bill using a simple billing system.\nThe department enters the number of electricity units consumed during the month.\nThe electricity provider uses the following rates:\nIf consumption is 100 units or less, the rate is \u09f35 per unit.\nIf consumption is more than 100 but not more than 200 units, the rate is \u09f37 per unit.\nIf consumption is more than 200 units, the rate is \u09f310 per unit.\nFor this problem, assume that one rate is applied to all consumed units.\nThe program should determine the appropriate rate and calculate the total bill.", "ios": [{"in": "Units: 80", "out": "Rate: 5\nTotal Bill: 400"}, {"in": "Units: 150", "out": "Rate: 7\nTotal Bill: 1050"}, {"in": "Units: 250", "out": "Rate: 10\nTotal Bill: 2500"}], "solution": "#include <stdio.h>\n\nint main() {\n    int units, rate, bill;\n    scanf(\"%d\", &units);\n\n    if (units <= 100) {\n        rate = 5;\n    } else if (units <= 200) {\n        rate = 7;\n    } else {\n        rate = 10;\n    }\n\n    bill = units * rate;\n    printf(\"Rate: %d\\nTotal Bill: %d\\n\", rate, bill);\n\n    return 0;\n}"}, {"id": 3, "title": "Cinema Ticket Booking", "description": "A cinema hall wants to create a simple ticket booking system.\nWhen a customer purchases a ticket, the system asks for the customer's age and the number of tickets they want to purchase.\nThe ticket price depends on the customer's age:\nBelow 12 years \u2192 \u09f3150 per ticket\n12 to 59 years \u2192 \u09f3300 per ticket\n60 years or above \u2192 \u09f3200 per ticket\nThe program should determine the ticket price based on the customer's age and calculate the total amount.", "ios": [{"in": "Age: 10\nTickets: 2", "out": "Total Cost: 300"}, {"in": "Age: 25\nTickets: 3", "out": "Total Cost: 900"}, {"in": "Age: 65\nTickets: 3", "out": "Total Cost: 600"}], "solution": "#include <stdio.h>\n\nint main() {\n    int age, tickets, price, total;\n    scanf(\"%d %d\", &age, &tickets);\n\n    if (age < 12) {\n        price = 150;\n    } else if (age <= 59) {\n        price = 300;\n    } else {\n        price = 200;\n    }\n\n    total = price * tickets;\n    printf(\"Total Cost: %d\\n\", total);\n\n    return 0;\n}"}, {"id": 4, "title": "Mobile Data Package", "description": "A mobile operator wants to calculate the monthly internet cost for its customers.\nThe company has three packages:\nBasic: 5 GB \u2192 \u09f3300\nStandard: 10 GB \u2192 \u09f3500\nPremium: 20 GB \u2192 \u09f3800\nThe customer enters a package code: B for Basic, S for Standard, P for Premium.\nThe program should display the selected package and its price.\nIf the customer enters anything other than B, S, or P, the program should display: Invalid Package", "ios": [{"in": "Package: S", "out": "Standard Package\nPrice: 500"}, {"in": "Package: X", "out": "Invalid Package"}], "solution": "#include <stdio.h>\n\nint main() {\n    char code;\n    scanf(\" %c\", &code);\n\n    if (code == 'B') {\n        printf(\"Basic Package\\nPrice: 300\\n\");\n    } else if (code == 'S') {\n        printf(\"Standard Package\\nPrice: 500\\n\");\n    } else if (code == 'P') {\n        printf(\"Premium Package\\nPrice: 800\\n\");\n    } else {\n        printf(\"Invalid Package\\n\");\n    }\n\n    return 0;\n}"}, {"id": 5, "title": "Student Result Processing", "description": "A university wants to create a simple result-processing program for its students.\nThe program takes the marks obtained by a student in three courses.\nFirst, calculate the student's total and average marks.\nThe university then assigns a result based on the average:\nAverage \u2265 80 \u2192 Excellent\nAverage \u2265 70 \u2192 Good\nAverage \u2265 60 \u2192 Satisfactory\nAverage < 60 \u2192 Needs Improvement\nThe program should display the total, average, and result category.", "ios": [{"in": "Marks: 85 90 80", "out": "Total: 255\nAverage: 85\nResult: Excellent"}, {"in": "Marks: 50 60 55", "out": "Total: 165\nAverage: 55\nResult: Needs Improvement"}], "solution": "#include <stdio.h>\n\nint main() {\n    int m1, m2, m3, total;\n    int average;\n    scanf(\"%d %d %d\", &m1, &m2, &m3);\n    \n    total = m1 + m2 + m3;\n    average = total / 3;\n    \n    printf(\"Total: %d\\n\", total);\n    printf(\"Average: %d\\n\", average);\n    \n    if (average >= 80) {\n        printf(\"Result: Excellent\\n\");\n    } else if (average >= 70) {\n        printf(\"Result: Good\\n\");\n    } else if (average >= 60) {\n        printf(\"Result: Satisfactory\\n\");\n    } else {\n        printf(\"Result: Needs Improvement\\n\");\n    }\n\n    return 0;\n}"}, {"id": 6, "title": "ATM Withdrawal System", "description": "A bank wants to implement a simple ATM withdrawal program.\nWhen a customer wants to withdraw money, the ATM asks for: Current account balance, Withdrawal amount.\nThe system checks whether the customer has enough money.\nIf the withdrawal amount is greater than the current balance, the ATM should display: Insufficient Balance\nOtherwise, the ATM should calculate the remaining balance.", "ios": [{"in": "Balance: 25000\nWithdrawal: 8000", "out": "Remaining Balance: 17000"}, {"in": "Balance: 5000\nWithdrawal: 6000", "out": "Insufficient Balance"}], "solution": "#include <stdio.h>\n\nint main() {\n    int balance, withdrawal;\n    scanf(\"%d %d\", &balance, &withdrawal);\n\n    if (withdrawal > balance) {\n        printf(\"Insufficient Balance\\n\");\n    } else {\n        printf(\"Remaining Balance: %d\\n\", balance - withdrawal);\n    }\n\n    return 0;\n}"}, {"id": 7, "title": "Ride Sharing Fare Calculator", "description": "A ride-sharing company wants to calculate the fare for a passenger based on the distance travelled.\nThe company uses different rates depending on the distance:\nUp to 5 km \u2192 \u09f320 per km\nMore than 5 km and up to 15 km \u2192 \u09f315 per km\nMore than 15 km \u2192 \u09f310 per km\nFor this problem, assume that the selected rate is applied to the entire distance.\nThe passenger enters the total distance travelled.\nThe program should determine the appropriate rate and calculate the total fare.", "ios": [{"in": "Distance: 4", "out": "Fare: 80"}, {"in": "Distance: 10", "out": "Fare: 150"}, {"in": "Distance: 20", "out": "Fare: 200"}], "solution": "#include <stdio.h>\n\nint main() {\n    int distance, rate, fare;\n    scanf(\"%d\", &distance);\n\n    if (distance <= 5) {\n        rate = 20;\n    } else if (distance <= 15) {\n        rate = 15;\n    } else {\n        rate = 10;\n    }\n\n    fare = distance * rate;\n    printf(\"Fare: %d\\n\", fare);\n\n    return 0;\n}"}, {"id": 8, "title": "Employee Salary Calculator", "description": "A software company wants to calculate the monthly salary of its employees.\nThe employee provides: Basic salary, House rent allowance, Medical allowance.\nThe company calculates gross salary using: Gross Salary = Basic Salary + House Rent + Medical Allowance\nAfter calculating the gross salary, the company provides a performance bonus:\nGross salary \u2265 \u09f350,000 \u2192 10% bonus\nGross salary \u2265 \u09f330,000 \u2192 5% bonus\nGross salary < \u09f330,000 \u2192 No bonus\nThe program should calculate the employee's gross salary, bonus, and final salary.", "ios": [{"in": "Basic: 30000\nHouse: 15000\nMedical: 5000", "out": "Gross: 50000\nBonus: 5000\nFinal: 55000"}, {"in": "Basic: 15000\nHouse: 5000\nMedical: 2000", "out": "Gross: 22000\nBonus: 0\nFinal: 22000"}], "solution": "#include <stdio.h>\n\nint main() {\n    int basic, house, medical, gross;\n    float bonus = 0, final_salary;\n    \n    scanf(\"%d %d %d\", &basic, &house, &medical);\n    gross = basic + house + medical;\n    \n    if (gross >= 50000) {\n        bonus = gross * 0.10;\n    } else if (gross >= 30000) {\n        bonus = gross * 0.05;\n    }\n    \n    final_salary = gross + bonus;\n    \n    printf(\"Gross: %d\\n\", gross);\n    printf(\"Bonus: %.0f\\n\", bonus);\n    printf(\"Final: %.0f\\n\", final_salary);\n\n    return 0;\n}"}, {"id": 9, "title": "Restaurant Discount System", "description": "A restaurant wants to introduce an automatic discount system for customers.\nThe customer enters the total amount of their food bill.\nThe restaurant offers:\nBill below \u09f31,000 \u2192 No discount\nBill from \u09f31,000 to below \u09f33,000 \u2192 10% discount\nBill \u09f33,000 or above \u2192 20% discount\nThe program should calculate the discount and final amount that the customer has to pay.", "ios": [{"in": "Bill: 4000", "out": "Discount: 800\nFinal Amount: 3200"}, {"in": "Bill: 800", "out": "Discount: 0\nFinal Amount: 800"}], "solution": "#include <stdio.h>\n\nint main() {\n    int bill;\n    float discount = 0, final_amount;\n    \n    scanf(\"%d\", &bill);\n    \n    if (bill >= 3000) {\n        discount = bill * 0.20;\n    } else if (bill >= 1000) {\n        discount = bill * 0.10;\n    }\n    \n    final_amount = bill - discount;\n    \n    printf(\"Discount: %.0f\\n\", discount);\n    printf(\"Final Amount: %.0f\\n\", final_amount);\n\n    return 0;\n}"}, {"id": 10, "title": "Parking Management System", "description": "A shopping mall wants to create a simple parking fee calculator.\nWhen a vehicle enters the parking area, the system records the number of hours it stayed.\nThe parking charges are:\nUp to 2 hours \u2192 \u09f350\nMore than 2 hours and up to 5 hours \u2192 \u09f3100\nMore than 5 hours \u2192 \u09f3200\nThe program takes the parking duration as input and determines the appropriate parking fee.", "ios": [{"in": "Hours: 1", "out": "Fee: 50"}, {"in": "Hours: 4", "out": "Fee: 100"}, {"in": "Hours: 6", "out": "Fee: 200"}], "solution": "#include <stdio.h>\n\nint main() {\n    int hours, fee;\n    scanf(\"%d\", &hours);\n\n    if (hours <= 2) {\n        fee = 50;\n    } else if (hours <= 5) {\n        fee = 100;\n    } else {\n        fee = 200;\n    }\n\n    printf(\"Fee: %d\\n\", fee);\n    return 0;\n}"}, {"id": 11, "title": "Vending Machine with Quantity", "description": "A university vending machine sells three products:\nA: Chips (\u09f330)\nB: Soda (\u09f340)\nC: Chocolate (\u09f350)\nA student selects a product by entering A, B, or C, and then enters the quantity.\nThe machine calculates total price = Quantity * Price.\nIf invalid, display: Invalid Selection", "ios": [{"in": "Selection: B\nQuantity: 3", "out": "Product: Soda\nTotal Price: 120"}, {"in": "Selection: X\nQuantity: 1", "out": "Invalid Selection"}], "solution": "#include <stdio.h>\n\nint main() {\n    char sel;\n    int qty, price = 0;\n    scanf(\" %c %d\", &sel, &qty);\n\n    if (sel == 'A') {\n        printf(\"Product: Chips\\n\");\n        price = 30;\n    } else if (sel == 'B') {\n        printf(\"Product: Soda\\n\");\n        price = 40;\n    } else if (sel == 'C') {\n        printf(\"Product: Chocolate\\n\");\n        price = 50;\n    } else {\n        printf(\"Invalid Selection\\n\");\n        return 0;\n    }\n\n    printf(\"Total Price: %d\\n\", price * qty);\n    return 0;\n}"}, {"id": 12, "title": "Internet Bill with Data Usage", "description": "An internet service provider calculates a customer's monthly bill based on data usage.\nRates:\nUp to 10 GB \u2192 \u09f350 per GB\nMore than 10 GB and up to 30 GB \u2192 \u09f340 per GB\nMore than 30 GB \u2192 \u09f330 per GB\nProgram displays: Data usage, Rate per GB, Total bill", "ios": [{"in": "Usage: 15", "out": "Usage: 15\nRate: 40\nTotal: 600"}, {"in": "Usage: 35", "out": "Usage: 35\nRate: 30\nTotal: 1050"}], "solution": "#include <stdio.h>\n\nint main() {\n    int usage, rate, total;\n    scanf(\"%d\", &usage);\n\n    if (usage <= 10) {\n        rate = 50;\n    } else if (usage <= 30) {\n        rate = 40;\n    } else {\n        rate = 30;\n    }\n\n    total = usage * rate;\n    printf(\"Usage: %d\\nRate: %d\\nTotal: %d\\n\", usage, rate, total);\n    return 0;\n}"}, {"id": 13, "title": "Library Late Fee", "description": "A university library charges students a late fee when they return books after the due date.\n0\u20133 days \u2192 \u09f35 per day\n4\u20137 days \u2192 \u09f310 per day\nMore than 7 days \u2192 \u09f320 per day\nProgram calculates total fine = late days * rate.", "ios": [{"in": "Days: 5", "out": "Fine: 50"}, {"in": "Days: 2", "out": "Fine: 10"}, {"in": "Days: 10", "out": "Fine: 200"}], "solution": "#include <stdio.h>\n\nint main() {\n    int days, rate, fine;\n    scanf(\"%d\", &days);\n\n    if (days <= 3) {\n        rate = 5;\n    } else if (days <= 7) {\n        rate = 10;\n    } else {\n        rate = 20;\n    }\n\n    fine = days * ra         function renderProblems() {
            const navContainer = document.getElementById('nav-links');
            const problemsContainer = document.getElementById('problems-container');

            problems.forEach(p => {
                // Sidebar Link
                const link = document.createElement('a');
                link.href = `#problem-${p.id}`;
                link.className = 'problem-link';
                link.textContent = `${p.id}. ${p.title}`;
                navContainer.appendChild(link);

                // Problem Card
                let iosHtml = '';
                p.ios.forEach((io, index) => {
                    iosHtml += `
                        <div class="io-section">
                            <div class="io-box">
                                <h4>Test Case ${index + 1} - Input</h4>
                                <pre>${io.in}</pre>
                            </div>
                            <div class="io-box">
                                <h4>Test Case ${index + 1} - Expected Output</h4>
                                <pre>${io.out}</pre>
                            </div>
                        </div>
                    `;
                });

                const card = document.createElement('div');
                card.className = 'problem-card';
                card.id = `problem-${p.id}`;
                card.innerHTML = `
                    <h2>${p.id}. ${p.title}</h2>
                    <div class="problem-desc">${p.description}</div>
                    ${iosHtml}
                    <button class="solution-btn" onclick="toggleSolution(${p.id})" id="btn-${p.id}">
                        View Solution Code
                    </button>
                    <div class="solution-content" id="sol-${p.id}">
                        <pre><code>${p.solution.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
                    </div>
                `;
                problemsContainer.appendChild(card);
            });
            
            const observerOptions = {
                root: null,
                rootMargin: '-20% 0px -60% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        document.querySelectorAll('.problem-link').forEach(link => {
                            link.classList.remove('active');
                            if (link.getAttribute('href') === `#${id}`) {
                                link.classList.add('active');
                                link.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        });
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.problem-card').forEach(card => {
                observer.observe(card);
            });
            
            checkRelease();
            setInterval(checkRelease, 1000);
        }

        function toggleSolution(id) {
            if (new Date() < releaseDate) {
                alert("Solutions are locked until August 18, 2026, 10:00 PM BDT.");
                return;
            }
            const sol = document.getElementById(`sol-${id}`);
            sol.classList.toggle('show');
        }

        function checkRelease() {
            const now = new Date();
            const alertBox = document.getElementById('countdown-alert');
            const countdownText = document.getElementById('countdown-text');
            
            if (now >= releaseDate) {
                alertBox.style.display = 'none';
                document.querySelectorAll('.solution-btn').forEach(btn => {
                    btn.disabled = false;
                    btn.innerHTML = '✨ View Solution Code';
                });
            } else {
                alertBox.style.display = 'flex';
                
                const timeDiff = releaseDate - now;
                const hours = Math.floor(timeDiff / (1000 * 60 * 60));
                const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);
                
                if (countdownText) {
                    countdownText.textContent = `Solutions will be revealed in ${hours}h ${minutes}m ${seconds}s.`;
                }

                document.querySelectorAll('.solution-btn').forEach(btn => {
                    btn.disabled = true;
                    btn.innerHTML = '🔒 Solution Locked';
                });
            }
        }

        renderProblems();
    </script>
